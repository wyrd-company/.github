slug: releases-and-deploys-run-without-approval
title: A release or deploy runs without a second person's approval
description: >-
  No ceremony control holds a release or deploy for a person's approval once
  it has started. At the Stable rung of a Trusted or Custodial repository a
  person starts each release and deploy, and that person alone decides that
  it ships, so a maintainer's mistake, or a maintainer account that someone
  else controls, releases and deploys with no second person looking. The
  organization is on GitHub Free. There, environment required reviewers work
  only on public repositories, and a private repository has no rulesets and
  no protected branches, so it can neither require a pull request review
  nor keep a writer from pushing straight to the default branch, as the
  risk `writers-change-the-default-branch-of-a-private-repository` records.
  No GitHub setting can hold a run of a private repository for a person, and
  a rule that no system checks protects nothing.
categories:
  - security
likelihood: 2
impact: 4
response: >-
  Accepted by the operator on 2026-11-19. Assurance controls check every
  release without a person, and Airlock reports a rendered workflow that
  differs from its applied record. An approval gate belongs in the
  organization's in-house service for asynchronous delivery workflows, held
  in its backlog, which separates publishing from verifying the publish
  target and checks the approval itself rather than through a GitHub plan
  feature. Moving the organization to GitHub Team does not restore an
  approval of a run, because GitHub documents environment required
  reviewers and wait timers on Team for public repositories only. It
  restores `delivery-default-branch-review` on private repositories, so a
  change reaches the default branch, and with it each release and deploy,
  only through a pull request, and it gives rulesets the means to require a
  person's approving review of that pull request, which this design does
  not set.
status: open
