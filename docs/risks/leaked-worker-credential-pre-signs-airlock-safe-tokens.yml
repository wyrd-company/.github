slug: leaked-worker-credential-pre-signs-airlock-safe-tokens
title: A leaked Worker credential pre-signs Airlock Safe tokens that outlive its removal
description: >-
  The Airlock Worker's Entra credential may ask Key Vault to sign with
  Airlock Safe's key, and Key Vault signs whatever digest it is sent. Whoever
  holds the credential, or runs code in the Worker, can therefore have Key
  Vault sign Safe JSON Web Tokens whose `iat` and `exp` lie in the future.
  GitHub's documentation requires `exp` to be no more than ten minutes
  into the future, checks a token against Safe's registered public keys
  when it is presented, and does not say how it treats an `iat` in the
  future; a pre-signed token presented inside its own window meets those
  rules, and mints an installation token, valid for an hour and able to
  read every repository of the organization. Rotating or removing the Entra secret, removing its sign role and
  disabling the key in Key Vault stop new signatures and leave every
  signature already made valid, until the private key is deleted from Safe's
  registration at GitHub.
categories:
  - security
  - confidentiality
likelihood: 1
impact: 4
response: >-
  It follows from the operator's ruling of 2026-11-21 that the Worker signs
  with Safe's key through its own Entra credential, and awaits the
  operator's acceptance with the rest of this design. What bounds it:
  Safe's registration is read-only, so a token minted this way reads and
  never writes; the Entra credential can do nothing but sign with this
  one key; and the recovery that `delivery-environments` gives ends the
  exposure without handing the replacement to the old signer: suspend
  Safe's installation; delete the Worker's Entra application with its
  secrets and role, and disable the old key in Key Vault; redeploy the
  Worker from a reviewed release; import a new private key under a new key
  name, which only a new Entra application may sign with, and delete the
  old one at GitHub; and resume an hour after the suspension, once the old
  key and the old application are gone. The vault's sign log then shows the
  calls made with the old key, not the claims they signed. What detects it: the vault of Safe's
  key sends its `AuditEvent` log, which records each sign operation with its
  caller and time, to a Log Analytics workspace, with an alert when the
  Worker's Entra application signs more often in a day than its central
  run's invocations need. The alert counts calls; it cannot show that no
  token was signed for the future.
status: open
