$schema: https://refinery.systems/ontology/risk
relationships:
  references:
    - delivery-environments
slug: environment-identity-reads-staged-secrets
title: An environment's identity reads a rotated secret before Elegua promotes it
description: >-
  Each credential environment's identity holds `Key Vault Secrets User` on its
  own vault, and Elegua stages a rotated credential there as
  `<name>-pending` until it promotes it. At the `sensitive` tier Elegua
  waits for a person before it promotes, so a workflow changed to read the
  staged name can use the new credential before that person approves. The
  staged credential carries the same authority as the live one, which the
  same identity already reads.
categories:
  - security
likelihood: 1
impact: 2
response: >-
  Accepted. Rendered workflows read only the names their declarations list,
  Airlock reports a rendered workflow that differs from its applied record,
  and a workflow change at the tiers that rotate with approval goes through a
  reviewed pull request. Role assignments scoped to each live secret, made
  once Elegua has placed it, remove the exposure.
status: open
