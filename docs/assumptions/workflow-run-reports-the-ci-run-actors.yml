$schema: https://refinery.systems/ontology/assumption
relationships:
  references:
    - delivery-skeleton
    - release-process
description: >-
  A release run that a `workflow_run` event starts reports as its `actor`
  the `actor` of the continuous integration run whose completion caused the
  event, and as its `triggering_actor` the account that started that run or
  last re-ran it. A release run that the completion of a re-run of
  continuous integration starts is a new run at `run_attempt` 1, not a
  re-run of an earlier release run, and an account of type `Bot` that
  re-runs continuous integration gives that release run a
  `triggering_actor` of type `Bot`, which ends it with
  mode `none` at an effective `release-approval` of `person`. If GitHub
  reports the account that pushed in both fields instead, the release run
  reads as that account's start, and the approval check still refuses that
  account as the approver.
end-descendant-type: spike
evidence:
  - GitHub's contexts reference describes `github.triggering_actor` as the
    account that initiated the run, which can differ from `github.actor` on
    a re-run, and a workflow run object carries both `actor` and
    `triggering_actor`.
  - GitHub does not state which accounts a run that `workflow_run` starts
    reports in its own two fields, nor what it reports when the triggering
    run was re-run.
  - No such run has been examined. The release template's live cases re-run
    continuous integration on the testbed and record the release run each
    re-run starts.
