$schema: https://refinery.systems/ontology/assumption
relationships:
  references:
    - delivery-skeleton
description: >-
  `GET /repos/<owner>/<repository>/actions/runs/<run id>/approvals`, called
  with the run's `GITHUB_TOKEN` holding `actions: read` from a job that needs
  an earlier job of the same run that entered an approval environment with
  required reviewers, lists the approval of that environment with state
  `approved` and the approving user's login.
end-descendant-type: spike
evidence:
  - GitHub documents the endpoint as listing the approvals of a run's
    deployments, each with its environments, state and user.
  - GitHub does not state which token permission reads it or when an
    approval appears in it.
  - The release template's live cases run the approval check in an
    environment with a required reviewer.
