$schema: https://refinery.systems/ontology/assumption
relationships:
  references:
    - delivery-controls
description: >-
  A job's `GITHUB_TOKEN` with `actions: read` lists the repository's
  environments through `GET /repos/<owner>/<repository>/environments`, with
  each environment's protection rules and its deployment branch policy, so
  the per-repository audit can check that each declared environment exists
  and admits the default branch only.
end-descendant-type: spike
evidence:
  - GitHub's list of permissions required for GitHub Apps places listing
    environments under the repository permission Actions, read, and places
    environment variables under the separate permission Environments, which
    a workflow token cannot hold.
  - Proven by the per-repository audit's run on the testbed.
  - On a private repository on GitHub Free the read answers 200 and lists
    branch policies that GitHub's documentation says it ignores, as
    `truename-idp` showed on 2026-11-19, so the audit takes a branch
    policy's effect from the declared plan of `delivery-controls`
    `plan-limits`, not from this read.
