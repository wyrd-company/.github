$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - delivery-standard
    - delivery-skeleton
    - delivery-declaration
    - delivery-apps
    - release-authority-token
  assumes:
    - cloudflare-deploy-token-permissions
format: names
description: >-
  The names that the templates, Terraform, Airlock and Elegua share for every
  route from a workflow job to a credential. A job reaches a credential only by
  entering a GitHub environment of its repository and then signing in to
  Azure by federation with that environment's identity to read a Key Vault
  secret or sign with a Key Vault key, or federating with a registry whose
  trusted publishing names that environment. Each environment holds only
  variables, never a secret. A rendered workflow names its environments and
  what each one carries in its delivery declaration, and nothing outside this
  list reaches a job. The run's `GITHUB_TOKEN`, which GitHub issues for one
  run and revokes when it ends, is the one token a job holds without an
  environment.


  Credential environments of the release template. `release-authority` is
  entered by the release workflow's `record` job, its
  `preflight-release-authority` job and `release-authority-smoke.yml`; it
  signs with the release authority App's key and reads no secret.
  `package-tags` is entered by the release workflow's `tag-after-publication`
  job and its `preflight-package-tags` job when the release model gives any
  tag `require_phase: after-publication`; it signs with the package tags App's
  key and reads no secret. `publish-<part>` is entered by the deliver jobs of a
  publication part that declares a secret, an App or trusted publishing, and
  by its `preflight-publish-<part>` job.


  Credential environments of the deploy template. Each deploy environment the
  deploy interview names, such as `staging` or `production`, is entered by
  the deploy workflow's `deploy-<environment>` job and its
  `preflight-<environment>` job. Its name is also the name of the Wrangler
  environment that the `cloudflare-worker` part deploys.


  Credential environment of the central audit. `airlock-safe` exists only
  in the organization's audit repository, is entered only by the `audit` job
  of its `.github/workflows/airlock-central.yml`, signs with Airlock Safe's
  key and reads no secret. Every other repository's Airlock configuration
  declares no environment: its `airlock-audit.yml` holds only the run's
  `GITHUB_TOKEN`, as `delivery-controls` states.


  Approval environments. `release-approval` is entered by the release
  workflow's `approve-release` job, and `<environment>-approval` by the
  deploy workflow's `approve-<environment>` job for each deploy environment,
  only in a run whose effective `release-approval` or `deploy-approval` is
  `person`. An approval environment carries no variable, no secret, no key
  and no trusted publishing; its required reviewers hold the job until a
  person other than the one who started the run approves.


  Variables in every credential environment that reads a secret or signs
  with a key. `AZURE_TENANT_ID` is the Entra tenant. `AZURE_CLIENT_ID` is the
  client id of the user-assigned managed identity whose federated credential
  trusts this environment. `AZURE_KEY_VAULT_URL` is the address of the one
  vault the environment uses, `https://` and the vault host with no path and
  no trailing slash. An environment either reads secrets or signs with App
  keys, never both, because it names one vault. An environment whose parts
  declare no secret and no key carries none of the three.


  An App credential is three variables in the environment that signs with
  it: `<APP>_APP_ID`, the App's numeric id; `<APP>_KEY_NAME`, the name of the
  Key Vault key that holds the App's private key, which is the App's slug;
  and `<APP>_INSTALLED_ON`, the repositories the App's installation may
  reach, each `<owner>/<repository>`, joined by commas, or `<owner>/*` for
  Airlock Safe. So `release-authority` carries `RELEASE_AUTHORITY_APP_ID`,
  `RELEASE_AUTHORITY_KEY_NAME` and `RELEASE_AUTHORITY_INSTALLED_ON`,
  `package-tags` carries the three `PACKAGE_TAGS_` variables,
  `publish-repo-wyrd-foo` the three `REPO_WYRD_FOO_PUBLISHER_` variables, and
  `airlock-safe` the three `AIRLOCK_SAFE_` variables. Every App and its key's
  vault are listed in the organization's App authorization file,
  `delivery-apps`, and an environment signs with an App only where that file
  allows it. The key is imported once
  by a person from the PEM that GitHub generates, with key operations `sign`
  only, into the vault the file names.


  Secrets each part reads, by Key Vault secret name, with the environment
  variable the part's step receives it as. `crates-io` reads `crates-io-token`
  as `CARGO_REGISTRY_TOKEN` in `publish-crates-io`. `npm` reads `npm-token` as
  `NODE_AUTH_TOKEN` in `publish-npm` when `npm_trusted_publishing` is false;
  when it is true, `publish-npm` reads nothing and declares
  `trusted_publishing: [npm]`, and each package's npm trusted publisher names
  this repository, `.github/workflows/release.yml` and the environment
  `publish-npm`. `homebrew-tap` reads `homebrew-tap-token` as
  `HOMEBREW_TAP_TOKEN` in `publish-homebrew-tap`. `cloudflare-worker` reads
  `cloudflare-api-token` as `CLOUDFLARE_API_TOKEN` in each deploy
  environment, together with the variable `CLOUDFLARE_ACCOUNT_ID`. `ghcr`
  and `product-build` read no secret; `ghcr` publishes with the run's
  `GITHUB_TOKEN` and `packages: write`. A secret name is lower case letters,
  digits and single dashes, at most 119 characters, and never ends in
  `-pending`, which is Elegua's staging form. A credential with several fields
  is one secret whose value is a JSON object with string members, declared
  with `fields`, which maps each member to the variable the reading steps
  receive it as. An AWS access key is the secret `aws-access-key` with members
  `access-key-id` and `secret-access-key`, received as `AWS_ACCESS_KEY_ID` and
  `AWS_SECRET_ACCESS_KEY`, beside the variable `AWS_REGION`.


  Vaults. Each credential environment that reads secrets reads its own vault,
  which holds exactly the secrets that environment's parts declare, so a
  staging and a production `cloudflare-api-token` live in two vaults. An
  environment that signs names the vault that holds its App's key, which
  several repositories share for a shared App. The vaults use Azure
  role-based access. An environment's identity holds `Key Vault Secrets User`
  on its own secrets vault, which also lets it read the `<name>-pending` value
  Elegua stages there during a rotation, and the role whose only data action
  is `Microsoft.KeyVault/vaults/keys/sign/action` on each key it signs with,
  at that key's scope. Elegua's writing identity holds
  `Key Vault Secrets Officer` on every vault that holds a secret of its
  manifest.


  Terraform. For each repository, Terraform reads the repository's delivery
  declarations from its default branch, and the organization's App
  authorization file, through the GitHub provider's `github_repository_file`
  data source, changing nothing in GitHub. It takes from the declarations the
  credential environments and which of them read secrets, and from the App
  file each enrolment it allows, with the App's id, installations and key
  vault; it takes as
  inputs the subscription, the tenant and each variable it does not create,
  such as `CLOUDFLARE_ACCOUNT_ID`. For each credential environment that reads
  a secret or signs, it creates a user-assigned managed identity with one
  federated identity credential: issuer
  `https://token.actions.githubusercontent.com`, subject
  `repo:<owner>/<repository>:environment:<environment>`, audience
  `api://AzureADTokenExchange`. It creates the vault of each environment that
  reads secrets and assigns the roles above; a key-scoped assignment reads
  the key as existing, so the key is imported before Terraform assigns sign
  on it, and Terraform assigns it only for an enrolment the App file allows.
  Its root module has one output, `github_environments`, whose value is an
  object keyed by `<owner>/<repository>`, then by credential environment
  name, then by variable name, with each variable's value as a string.
  `terraform output -json github_environments` prints that object, and it is
  the whole of what Airlock reads from Terraform. Terraform writes no secret
  value and creates no secret.


  Airlock. Airlock writes GitHub settings only in an attended run of its
  console, which a person starts and signs in to as Airlock Admin through
  GitHub's device flow; no workflow and no scheduled run holds a credential
  that writes GitHub settings. For each environment that a repository's
  delivery declarations name, Airlock creates the environment, restricts its deployments to the
  default branch through a custom branch policy, and writes exactly the
  variables the declaration lists, with the values from `github_environments`
  for that repository and environment. It gives each approval environment
  required reviewers, with self-review prevented, from Airlock's repository
  configuration, and gives no credential environment required reviewers. For
  each environment that declares `trusted_publishing`, it sets each listed
  registry's trusted publisher for the repository's packages to that
  repository, workflow file and environment. npm manages trusted publishers
  only for an account with write access to the package and two-factor
  authentication, through `npm trust github`, `npm trust list` and
  `npm trust revoke`, so Airlock writes and reads npm trust only in an
  attended run that uses the npm session of the person running it; Airlock
  holds no npm credential, and its scheduled audits report npm trust as not
  verified in that run. Airlock defines the organization custom property
  `release`, a boolean, and sets it to `true` on every repository that holds
  a release declaration, which selects the repository for the rulesets of
  `delivery-controls`. It keeps GitHub's immutable
  releases on unless the repository's effective `evidence` control is `on`,
  as the decision record `keep-release-assets-mutable-for-evidence` states.
  Airlock writes the bypass actors of every ruleset that `delivery-controls`
  names, and at the end of each attended run the attested record that
  `delivery-controls` defines. Airlock writes no environment secret, no
  repository secret and no organization secret.


  Elegua. Every secret a delivery declaration lists is a secret of Elegua's
  manifest with a destination whose store is an `azure-key-vault` store whose
  `vault-url` equals the environment's `AZURE_KEY_VAULT_URL`, and whose `path`
  equals the secret name. Its manifest `tier` is `sensitive` when the
  effective `rotation-approval` of any repository whose environment reads it
  is `person`, and `routine` otherwise. App keys are Key Vault keys, not
  secrets, and are outside Elegua's manifest: GitHub offers no API that
  generates an App's private key, so a person generates it in the App's
  settings and imports it once, and Elegua has nothing to mint.
validation-criteria: >-
  The delivery declaration schema restricts environment names, secret names,
  fields and variable names to the forms above, refuses an approval
  environment that carries a variable, a secret, a key or trusted publishing,
  refuses an environment that carries both secrets and keys, and refuses an
  Airlock configuration declaration with any environment other than
  `airlock-safe`. Each
  template's tests render every part and compare the environments, secrets,
  keys, trusted publishing and variables in the rendered declaration with the
  lists above. A test of each rendered workflow finds no `secrets.` expression
  other than `secrets.GITHUB_TOKEN`, no `vars.` expression outside a job that
  enters an environment, no environment variable name that the rendered
  declaration does not list for that job's environment, and no
  `id-token: write` in a job that enters no credential environment other than
  the parent's `attest` job. Terraform's module tests plan one repository from
  a declaration and an App file and compare `github_environments` with the
  variable names the declaration lists for each environment. Airlock's apply
  tests compare the environments, variables, reviewers and trusted publishers
  it writes for a repository with that repository's declarations.
