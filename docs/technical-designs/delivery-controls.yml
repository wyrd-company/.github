$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - delivery-standard
    - delivery-skeleton
    - release-process
    - deploy-process
  references:
    - delivery-declaration
    - delivery-environments
    - continuous-integration
objective: >-
  Define how a repository answers its tier, how the tier, the controls set
  away from their defaults and their reasons are held in the applied record,
  how a workflow and Airlock compute each control's effective setting and
  every deviation at the repository's rung, and where each floor, assurance and
  ceremony control sits in what the templates render.
background:
  current-design: >-
    The delivery standard defines three tiers, the yes-or-no questions that
    suggest one, four rungs that Airlock observes from Intentional tag records,
    the floor, the assurance controls with their tier defaults, the ceremony
    with its tier defaults at Stable, and a deviation as a control set below
    the default at the current rung with a recorded reason. The release
    template on `epic/release-process` asks no tier question and renders no
    tier-dependent control. Airlock has rungs, waivers and exceptions, and no
    tier.
  problems:
    - >-
      The tier is the only declaration of how strict delivery is, and it must
      exist once, in the applied record, while two templates render workflows
      that depend on it.
    - >-
      A deviation is judged at the current rung, which changes after the
      answers were given, so a reason must exist before the deviation does.
design-challenges:
  one-declaration-two-templates: >-
    Toha gives no template another application's answers. The release
    template, which every repository on the standard applies, asks the tier
    and every control, and renders them into `.github/delivery/release.json`,
    which the deploy workflow reads when it runs. The decision record
    `hold-the-tier-in-the-release-application` holds the trade-off.
  reasons-before-deviations: >-
    A reason is required for every control answered below the tier's default
    at the Stable rung, which is the strictest default the control will reach,
    so no rung change creates a deviation without a reason.
proposed-design:
  tier-interview: >-
    The release template asks seven `confirm` questions, each with default
    false, in this order. `tier_others_secrets`: does it store or handle
    secrets, credentials, or personal data that belong to someone other than
    the person running it? `tier_sign_in`: do people sign in to it or through
    it? `tier_changes_others`: does it hold credentials that can change other
    repositories, cloud accounts, or organization settings?
    `tier_others_data_service`: is it a running service that other people's
    data passes through? `tier_runs_in_builds`: does it run inside other
    repositories' build or release workflows? `tier_shapes_shipments`: does it
    produce or change what other projects ship, such as versions, generated
    files, or base images? `tier_credentials_purpose`: is handling credentials
    or tokens its purpose? A computed value `tier_suggested` is `custodial`
    when any of the first four is true, otherwise `trusted` when any of the
    last three is true, otherwise `standard`. The `select` question `tier`
    offers `custodial`, `trusted` and `standard`, with prompt
    `Tier (suggested: {{ tier_suggested }})` and default
    `{{ tier_suggested }}`. The `text` question `tier_reason` is always
    asked, and is required when the chosen tier ranks below the suggestion,
    with custodial above trusted above standard. A change of tier is a pull
    request that re-answers the interview, and every change to a lower tier
    than the recorded one carries a new `tier_reason`, whether or not the
    re-answered questions suggest the lower tier, as the operator ruled and
    the standard states. Toha cannot show the interview the recorded tier, so
    the release template's rendered pull request check, the `delivery` job of
    `intentional.yml`, compares `.github/delivery/release.json` at the pull
    request's base and head, and fails when the head's tier ranks below the
    base's and the head's `tier_reason` is absent or equals the base's.

  release-authority-app: >-
    The `text` question `release_authority_app` holds the slug of the App
    that creates the repository's release commits and tags, validated by
    `^[a-z0-9]+(-[a-z0-9]+)*$` and at most 34 characters. Its default is the
    slug in the template data `release_authority_apps` for the chosen tier,
    which holds the slugs of the organization's Intentional Apps for
    `standard` and `trusted` as they are registered; `custodial` has no entry,
    so a Custodial repository names its own App. The `text` question
    `package_tags_app` holds the slug of the App that creates tags after
    publication, asked when the release model gives any tag
    `require_phase: after-publication`, with its default from
    `package_tags_apps` keyed the same way. An answer names an App; it grants
    nothing. A repository signs with an App only where the organization's App
    authorization file, `delivery-apps`, allows that repository, role and
    tier: Terraform grants the key's sign role and Airlock names the App as a
    bypass actor only for such an enrolment, and Airlock's audit fails a
    declaration that names any other App. An adopter outside the organization
    answers both with its own Apps and keeps its own authorization file.

  control-catalog: >-
    Assurance controls take `on` or `off`. `rehearsal`, the release rehearsal
    that continuous integration runs on every commit with pending intents;
    `sealed-plan`, the release plan committed in the release commit and bound
    to the tag records by its digest; `revalidation`, the independent check of
    the pushed release before anything is published; `provenance`, build
    provenance attested for each release asset and verified on the bytes read
    back after publication; `evidence`, the durable evidence file on each
    release record; and `consumer-after`, a clean install of what was
    published, are `on` at Trusted and Custodial and `off` at Standard.
    `consumer-before`, a clean install of what was built before anything is
    published, and `authority-smoke`, the smoke workflow that proves the
    release authority without changing anything, are `on` at Custodial and
    `off` at Trusted and Standard. Assurance defaults do not vary with the
    rung. Ceremony controls are `release-start` and `deploy-start`, which take
    `automatic` or `person`; `release-approval`, `deploy-approval`,
    `update-review` and `rotation-approval`, which take `none` or `person`.
    Below Stable every tier takes Standard's ceremony: both starts
    `automatic` and the four others `none`. At Stable, Standard keeps that;
    Trusted takes `person` for both starts and for `update-review`, and `none`
    for the three others; Custodial takes `person` for all six. A setting
    ranks below another when it is `off` against `on`, `automatic` against
    `person`, or `none` against `person`.

  control-answers: >-
    The `confirm` question `customize_controls`, default false, asks whether
    any control is set away from its default. When it is true, the template
    asks one `select` question per control, with id `control_` followed by
    the control id with dashes written as underscores, such as
    `control_sealed_plan`, options `default` and the control's two settings,
    and default `default`. For each answer that is not `default` and ranks
    below the tier's default at Stable, the required `text` question
    `control_<id>_reason` is asked. Questions that are skipped are not
    recorded, so a repository that sets nothing records only its tier
    answers. The release declaration's `controls` holds every control whose
    answer is not `default`, with its `setting` and, when asked, its
    `reason`.

  effective-setting-and-deviation: >-
    A control's effective setting at a rung is the recorded setting when one
    exists and otherwise the tier's default at that rung. A deviation is a
    control whose effective setting ranks below the tier's default at the
    repository's current rung; it carries the recorded reason. A setting
    above its default is not a deviation and needs no reason. The skeleton's
    `scripts/delivery.js` and Airlock compute both from the same three inputs:
    the release declaration's `tier` and `controls`, and the observed rung.
    Assurance controls take effect when the release template renders, so a
    change to one is a template update; ceremony controls take effect when a
    run computes them.

  applied-record-fields: >-
    In `.toha.json`, the release application is the application whose
    `source` is the release template's source that the organization accepts
    under `REPO-TPL-01`, and the deploy and Airlock configuration applications
    likewise for their templates. Airlock reads from the release application
    `commit`, `parts`, `answers.tier`, `answers.tier_reason`, the seven
    `answers.tier_*` question answers, `answers.release_authority_app`,
    `answers.package_tags_app`, `answers.customize_controls`, every
    `answers.control_<id>` and `answers.control_<id>_reason`,
    `answers.ci_workflow`, `answers.ci_workflow_name` and
    `answers.release_model`; from the deploy application `commit`, `parts`,
    `answers.deploy_unit` and `answers.environments`; from the Airlock
    configuration application `commit`; and
    from each, `paths`, to find the files it renders. An answer absent from
    the record is a question that was skipped, and takes its default.

  floor-placement: >-
    The release commit and the tags created with it are pushed only by the
    release workflow's `record` job, inside `release-authority`, with a token
    the token action mints from the release authority App for the one
    repository with `contents: write`; the tags that wait for publication are
    pushed only by `tag-after-publication`, inside `package-tags`, with a
    token from the package tags App. `release-record` and `evidence` hold the
    run's `GITHUB_TOKEN` with `contents: write`, which can change releases and
    their assets but, under the rulesets below, cannot create, move or delete
    a tag or update the default branch. Every credential reaches a job through
    its environment, as `delivery-skeleton` defines, and no rendered workflow
    reads a repository or organization secret; the absence of repository
    secrets is Airlock's audit. Tags are immutable and classified by the
    rulesets of `rulesets`. Recovery runs from the immutable tags: a release
    dispatched again for its source commit finds its tags, and every job that
    changes state outside the run does only what is missing. No answer removes
    any of these.

  rulesets: >-
    Airlock applies three organization rulesets, each with enforcement
    `active`, each targeting the repositories whose organization custom
    property `release` is `true`, which Airlock defines and sets on every
    repository that holds a release declaration. `delivery-tags-immutable`: target `tag`, ref condition include
    `~ALL`, rules `update`, `deletion` and `non_fast_forward`, no bypass
    actor. `delivery-tags-unclassified`: target `tag`, include `~ALL`,
    exclude `[0-9]*.[0-9]*.[0-9]*` and `**@[0-9]*.[0-9]*.[0-9]*`, rule
    `creation`, no bypass actor, so every tag outside the organization's two
    classified forms, bare SemVer and `<name>@<SemVer>`, is refused to
    everyone. `delivery-default-branch`: target `branch`, include
    `~DEFAULT_BRANCH`, rules `pull_request`, `required_linear_history`,
    `non_fast_forward` and `deletion`, with bypass mode `always` for every
    release authority App in `delivery-apps`; an App acts only on the
    repositories it is installed on, which `delivery-apps` limits and the
    audit checks, so each repository's effective bypass is its own release
    authority App, and `record` can push the release commit. On each
    repository Airlock applies three repository rulesets whose ref patterns
    come from the release model's tag templates, with `{version}` written as
    `[0-9]*.[0-9]*.[0-9]*` and `{id}` as the unit's literal id.
    `delivery-tags-recorded`: target `tag`, include the patterns of every
    template with no `require_phase` or with `before-publication`, rule
    `creation`, bypass the repository's release authority App only.
    `delivery-tags-published`: target `tag`, include the patterns of every
    template with `after-publication`, rule `creation`, bypass the
    repository's package tags App only. `delivery-tags-repository`: target
    `tag`, include `~ALL`, exclude every pattern of the two others, rule
    `creation`, no bypass actor, so a classified name that no template of the
    repository produces is refused too. These are repository rulesets because
    their patterns belong to one repository and GitHub limits an
    organization to 75 rulesets; a repository administrator can change them,
    and Airlock's audit reports any difference. A tag name that matches both
    phases' patterns is refused to both Apps, so Airlock refuses a release
    model whose patterns of the two phases overlap, `resolve` refuses a plan
    in which a tag matches a pattern of the other phase, and a template whose
    tag is not bare SemVer or `<name>@<SemVer>` is refused by `resolve`. The
    patterns admit some names that are not SemVer; the only writers of
    matching names are `record` and `tag-after-publication`, which push
    exactly the tag names of the plan. Bypass actors are visible only with
    administration access, so the workflow's own check is limited: `resolve`
    and the smoke workflow read the effective rulesets with `GITHUB_TOKEN` and
    require each of these to be present and `active` with the conditions and
    rules above, and Airlock's audit, which reads with administration access,
    checks the bypass lists.

  assurance-placement: >-
    `rehearsal`: the release template renders
    `.github/workflows/release-rehearsal.yml`, continuous integration calls
    it, and `resolve` requires its success for the source commit.
    `sealed-plan`: `resolve` writes Intentional's plan to
    `.intentional/release-plan.json` in the release commit, and `record` and
    `revalidate` require its `digest` to equal every tag record's
    `plan-digest`. `revalidation`: the `revalidate` job between `record` and
    the deliver stage. `provenance`: the parent's `attest` job, which runs no
    repository code, attests every release asset the build stage produced
    with `actions/attest-build-provenance`, and `verify-provenance` verifies
    the attestation of every asset downloaded back from its release record
    against the expected source and signer identity that `release-process`
    states; each federated registry part verifies the registry's own
    provenance for what it published. `evidence`: the `evidence` job attaches
    `release-evidence.json` to each release record. `consumer-before`: each
    part's `consume-` jobs in the build stage. `consumer-after`: each part's
    `verify-` jobs that install from the registry. `authority-smoke`: the
    release template renders `.github/workflows/release-authority-smoke.yml`.
    A control that is `off` renders none of its jobs or files.

  ceremony-placement: >-
    `release-start` and `deploy-start`: each workflow's `resolve` ends an
    automatic run when the effective setting is `person`. `release-approval`:
    the release workflow's `approve-release` job, which enters
    `release-approval` when the effective setting is `person` and the run will
    push, and the `record` job's approval check. `deploy-approval`: each
    `approve-<environment>` job, which enters `<environment>-approval`, and
    each `deploy-<environment>` job's approval check. Airlock gives every
    approval environment required reviewers with self-review prevented, and
    the approval check refuses an approval by the run's `actor` or its
    `triggering_actor`, so the person who approves is never a person who
    started or re-ran the run; a
    Custodial repository with one maintainer cannot release or deploy at the
    Stable rung, as the standard states. `update-review`: the session that
    applies a template update reads the release declaration and leaves the
    update's pull request for a person when the effective setting is
    `person`, and merges it otherwise. `rotation-approval`: Elegua's manifest
    gives each secret that the repository's environments read
    `tier: sensitive` when the effective setting is `person`.

  audit: >-
    The Airlock configuration template renders
    `.github/workflows/airlock-audit.yml`, which runs on `schedule` once a
    day, on `workflow_dispatch` and on `push` to the default branch, with
    `permissions: {}`, and runs the pinned Airlock action, which reads no
    repository or organization secret. The audit needs a token that reads
    the repository's settings, rulesets with their bypass actors,
    environments with their reviewers and its secrets list, and, for the App
    checks, each enrolled App's installations. Which App signs that token,
    which repositories hold its key, and whether the privileged part of the
    audit runs in each repository or centrally await the operator's ruling on
    the audit's trust boundary; until then no repository's environment is
    granted an audit key, and the rendered workflow runs the checks that the
    run's `GITHUB_TOKEN` can make and reports the others as not run. The
    audit reads the applied record, the three declarations, the release
    model, the repository's settings, rulesets with their bypass actors,
    environments with their reviewers, the repository's secrets list, the tag
    records, the release records with their assets, `delivery-apps` and
    Elegua's manifest, and reports the tier, the observed rung, and every
    deviation with its reason. It fails when the tier ranks below the
    organization's minimum for the repository; when the tier ranks below the
    suggestion of the recorded answers, or below the tier recorded in the
    base of a pull request or in the first parent of the commit that changed
    it, and that change records no new `tier_reason`; when a deviation has no
    reason; when the repository holds a repository-level secret; when a file
    the record lists differs from what its application renders; when a
    control's effective setting needs a job, a file, a ruleset, an
    environment rule or a required reviewer that is absent; when an approval
    environment has no required reviewer; when immutable releases are off and
    `evidence` is off; when a release asset differs from its `SHA256SUMS`, its
    evidence file or its attestation; when a declaration names an App that
    `delivery-apps` does not allow for the repository, or an App is installed
    outside its `installed_on`; when a secret that a declaration lists is not
    a destination of Elegua's manifest in the environment's vault; and when
    such a secret's manifest `tier` is not the one its readers' effective
    `rotation-approval` requires. npm's trusted publishers are readable only
    with the npm session of a person with write access and two-factor
    authentication, so an attended Airlock run checks that each package's
    trusted publisher names the declared workflow and environment, and the
    scheduled audit reports npm trust as not verified. It reads Elegua's
    manifest from the repository and path its organization configuration
    names; the manifest holds names and policies, never values.
