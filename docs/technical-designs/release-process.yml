$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - delivery-standard
    - delivery-skeleton
    - delivery-controls
    - deploy-process
    - template-composition
    - release-model
    - release-process-conformance
  references:
    - delivery-environments
    - delivery-declaration
    - release-authority-token
    - continuous-integration
  assumes:
    - release-authority-pushes-the-release-atomically
objective: >-
  Define contract `release-process`: the Toha release template in this
  repository that renders a repository's release workflow from its committed
  Intentional release model and its interview answers; the release workflow
  that starts from a source commit, creates the release commit and its tags
  through the release authority, and delivers through the selected
  publication parts; the internal part interfaces through which a part adds
  jobs and credentials; and the release-side files the template renders
  beside the workflow.
background:
  current-design: >-
    Intentional computes versions from intents, writes the release model
    `.intentional/release-model.json` with schema identity
    `https://intentional.foo/schemas/release-model/1`, and writes changelogs
    and annotated tag records through `plan`, `apply` and `tag --plan`. It
    commits nothing and pushes nothing. Toha renders templates, accepts the
    release model through a `type: document` question, renders the parts a
    repository selects inside the parent template, and records each
    application in `.toha.json`. The delivery standard decides that a release
    starts from one commit of the default branch that passed continuous
    integration, that the workflow creates the release commit and its tag
    through a GitHub App inside a protected environment, and that every
    credential reaches a job through an environment and Key Vault.
  problems:
    - >-
      A release commit and its tags must be created by the release authority
      from exactly the source commit that passed continuous integration, with
      no build or Intentional step running beside the authority's token.
    - >-
      A release that stops part way must finish from its immutable tags by
      running again, without a person writing a commit or a tag.
    - >-
      Publication targets differ between repositories, but the workflow is one
      file that only the parent template writes.
design-challenges:
  release-commit-without-credentials: >-
    `resolve` builds the release commit and its tag objects in a job that
    holds no credential, from fixed identities and times, and hands them to
    `record` as a Git bundle. `record` verifies the bundle and only pushes it.
    Because the commit and the tag objects are deterministic, `revalidate`
    builds them again independently and compares object ids.
  one-writer-per-file: >-
    Only the parent template writes the workflow. Parts add jobs and
    credentials as data, and the parent places them, writes every `needs`
    list and every condition, and enters every environment.
  parent-owns-the-gate: >-
    A part job must never run for a Release Unit the run does not release,
    after a failed check, or before the release record of a unit that requires
    one. The parent writes every gate, and a part job can only narrow its
    condition.
  action-version-comments: >-
    `REPO-CI-04` reads the version comment after a pinned action reference.
    Part partials write the reference and its comment as YAML text, and
    repository tests check the pinned reference with its comment before
    validating the parsed job against the internal schema.
proposed-design:
  high-level-overview: >-
    The parent template `release` accepts the release model through a
    document question and renders `.github/workflows/release.yml`,
    `.github/workflows/release-rehearsal.yml` at `rehearsal` on,
    `.github/workflows/release-authority-smoke.yml` at `authority-smoke` on,
    `.github/workflows/intentional.yml`, and `.github/delivery/release.json`.
    The release workflow runs the six skeleton stages. `resolve` computes the
    Intentional plan at the source commit and, for a new release, builds the
    release commit and its tags without credentials. Check credentials enters
    each publication environment. Build runs the parts' build, assembly and
    clean-consumer jobs on the release commit. Record pushes the release
    commit and its tags through the release authority, publishes one release
    record per released unit that requires one, and, at `revalidation` on,
    rechecks the pushed release independently. Deliver runs the parts' publish
    jobs. Verify runs the parts' verify jobs, verifies provenance, creates the
    tags that wait for publication, and attaches the evidence file. Publication
    targets are optional parts inside this parent, selected with
    `--with <PART>` and `--without <PART>`.

  repository-layout: >-
    Each template has a directory under `templates/`, addressed as
    `gh:wyrd-company/.github#templates/<name>`. `templates/release/` holds
    `template.yml` (the interview, the schema directory and the part data),
    `schemas/release-model-1.schema.yml` (vendored, see
    release-model-acceptance),
    `partials/` (the release workflow's own fragments), `skeleton/` (the copy
    of `templates/skeleton/` that `delivery-skeleton` defines), `targets/<part>/`
    (each part's `target.yml` and job partials) and `template/`, the source
    directory whose files are rendered: `.github/workflows/release.yml`,
    `release-rehearsal.yml`, `release-authority-smoke.yml`, `intentional.yml`
    and `.github/delivery/release.json`. The parts are `product-build`,
    `crates-io`, `npm`, `ghcr`, `homebrew-tap` and `repo-wyrd-foo`.
    `templates/airlock-config/` renders `.github/airlock.yml`, and `airlock/`
    holds the organization policy that Airlock resolves.

  release-model-acceptance: >-
    The interview starts with question `release_model`: `type: document`,
    `schema: https://intentional.foo/schemas/release-model/1`, and
    `input: .intentional/release-model.json`. `template.yml` declares
    `schemas: schemas`; files in that directory are indexed by `$id`. The
    vendored `schemas/release-model-1.schema.yml` is a byte-for-byte copy of
    Intentional's `docs/specifications/release-model.schema.yml`, and a test
    compares the copy with the Intentional release it names. Toha reads the
    model on every apply, update, stage and preview, refuses invalid input
    without writing, and records the document at `answers.release_model`. The
    workflow reads these members: `$schema`; the `release_units` keys;
    `release_units.<id>.release_record`; `.changelog`; and
    `.tags.<tag id>.role`, `.template` and `.require_phase`. Part defaults can
    also read `release_units.<id>.path`, `projections`, `ecosystems`,
    `depends_on` and `sources`; each part's `target.yml` names the members it
    reads in comments. The template reads no `.intentional/config.yml`.

  interview: >-
    After `release_model` and the part question `targets`, the template asks
    the tier questions, `tier` and `tier_reason`, and then
    `release_authority_app` and `package_tags_app`, as `delivery-controls`
    defines. `ci_workflow` (default `ci.yml`, validated by
    `^[A-Za-z0-9_.-]+\.ya?ml$`) and `ci_workflow_name` (default `CI`,
    validated by `^[A-Za-z0-9 _.-]+$`) name continuous integration as
    `continuous-integration` defines. `release_prepare_recipe`, a local
    action path validated like the product recipes or empty (the default),
    names a repository action that `resolve` runs after `intentional apply` to
    update files derived from versions, such as lock files. `latest_unit` is
    asked when more than one unit has `release_record: required`.
    `customize_controls` and the `control_` questions follow. Each part's
    own questions, including `<part>_units`, carry `when` conditions on
    `targets`.

  modes: >-
    `resolve` sets the run's `mode`. With `workflow_dispatch`, the input
    `source-sha` is required and must be 40 lowercase hexadecimal characters,
    `github.ref` must be the default branch, and the boolean input `baseline`
    (default false) chooses the baseline mode. With `workflow_run`, the source
    commit is `github.event.workflow_run.head_sha`; the run is mode `none`
    when the triggering run was not a `push` on the default branch or was
    cancelled or skipped, and `resolve` fails, naming the triggering run, when
    that push run failed, as `delivery-skeleton` lists. `resolve` checks out the source commit with
    `fetch-depth: 0`, which brings every tag with its tag object, and
    `persist-credentials: false`, reads the default branch head from `GET /repos/<owner>/<repository>/git/ref/heads/<default>`,
    and refuses to continue when the repository's effective rulesets do not
    refuse updates and deletions of tags. Mode `baseline` requires a dispatch
    whose source commit is the default branch head and creates the baseline
    tags that `intentional tag --baseline` computes. Otherwise `resolve` runs
    `intentional plan`. An empty plan is mode `none` for an automatic run and
    fails a dispatch. A plan whose released unit has a primary tag with
    `require_phase: after-publication` fails and names the unit and the tag.
    When no tag of the plan that the release commit carries exists, the mode
    is `release`, and the source commit must be the default branch head: an
    automatic run whose source is no longer the head is mode `none` with the
    summary that a later commit superseded it, and a dispatch fails. When
    every such tag exists, the mode is `recover`: each must be annotated,
    pass `intentional verify <tag> --json`, and point at one commit whose
    only parent is the source commit and which the default branch head
    contains. Any other combination fails and names the tags. Modes `release`
    and `recover` require continuous integration evidence for the source
    commit as `continuous-integration` defines. Finally `resolve` computes
    the effective ceremony at the rung the repository holds once the plan's
    versions exist, and an automatic run whose effective `release-start` is
    `person` is mode `none`.

  release-commit: >-
    In mode `release`, `resolve` runs `intentional apply`, then the
    `release_prepare_recipe` action when one is answered, then, at
    `sealed-plan` on, writes the exact bytes `intentional plan` printed to
    `.intentional/release-plan.json`. It stages every change and commits it
    with author and committer `Intentional <intentional@wyrd.company>`, both
    dates one second after the source commit's committer date with its UTC
    offset, and the message `chore(release): ` followed by the plan's tag
    names in `tag_order`, separated by a comma and a space. The release
    commit's only parent is the source commit. `resolve` then runs
    `intentional tag --plan <plan>` and
    `intentional tag --plan <plan> --phase before-publication`, whose tag
    objects Intentional writes with a fixed tagger and the release commit's
    committer time. It writes
    `git bundle create release-candidate.bundle <release commit> <each tag> ^<source commit>`,
    and uploads it with the plan as the artifact `release-candidate`. It
    uploads `release-outcome.json`, holding `mode`, `source_sha`,
    `release_sha` and `releases`, as the artifact `release-outcome` in every
    mode, for the deploy workflow.

  record: >-
    `approve-release` runs after the build stage in modes `release` and
    `baseline` when the effective `release-approval` is `person`; it enters
    `release-approval` with no permission and does nothing else, so GitHub holds it until a person
    approves. `record` then enters `release-authority` with `contents: read`,
    `actions: read` and `id-token: write`, and runs only Git, the token
    action and the skeleton's checks. When the effective `release-approval` is `person`, it
    runs the approval check first. In mode `release` it checks out the source
    commit, downloads `release-candidate`, runs `git bundle verify`, fetches
    the bundle, and checks with Git alone that the release commit's only
    parent is the source commit, that the bundled tags are exactly the plan's
    tags with no `require_phase` or with `before-publication`, by name, that
    every bundled tag is annotated, points
    at the release commit and carries a tag record whose first line is
    `intentional release record` and whose `plan-digest` is the plan's
    `digest`, and, at `sealed-plan` on, that the committed plan's `digest` is
    that same value. It reads the default branch head again and
    requires it to be the source commit. It then runs the token action for the
    calling repository with `permission-contents: write`, and pushes with
    `git push --atomic` the release commit to `refs/heads/<default>` and every
    bundled tag to its name, passing the token in an `http.extraheader` set
    for that one command. It reads the remote branch and every tag back and
    requires the pushed object ids. In mode `recover` it requires every tag
    the release commit carries to exist on the remote and point at the
    release commit, and pushes nothing. In mode `baseline` it pushes the
    baseline tags atomically and updates no branch.

  release-records: >-
    The release record is the GitHub Release of one release of one Release
    Unit, on that unit's primary tag; the tag record is the annotated tag
    message. The parent renders `release-record` when some unit has
    `release_record: required`. It runs after `record` as a matrix over
    `record_units` with `permissions: contents: write`, through the run's
    `GITHUB_TOKEN`, under the stage gate and `needs.resolve.outputs.record ==
    'true'`. For each unit the outcome is exactly one published GitHub
    Release on the primary tag: its `tag_name` is the primary tag and its
    title is the tag name. A version with a prerelease part is published as a
    prerelease and not latest; of the others, only the unit named by
    `latest_unit` is marked latest. The notes are the section of the unit's
    changelog at the release commit whose heading line is exactly
    `## <version>`, up to the next `## ` heading; a missing or empty section
    fails the job. Build and assembly jobs upload workflow artifacts named
    `release-asset+<unit>+<name>`; the job attaches the files of the artifacts
    that match `release-asset+<unit>+*` and adds `SHA256SUMS` when it attaches
    any. The `+` separator cannot occur in a unit id. The job creates a record
    through the REST API as a draft with the tag, title and notes, uploads
    each expected asset, and publishes it with its prerelease and latest
    settings. Before creating anything it lists the repository's releases,
    drafts included, and keeps those whose `tag_name` is the primary tag.
    With none it runs the whole sequence. With one draft whose asset names
    are all expected, it sets the title and notes, replaces the assets from
    this run's artifacts and publishes it; a draft with any other asset name
    fails and names the draft. With one published release, it succeeds
    without change only when the prerelease flag is the version's and the
    asset names are the expected names, together with `release-evidence.json`
    when the `evidence` job already attached it; any other difference fails
    and names it. More than one release on the tag fails. After creating or
    completing a record it reads it back by tag and requires a published
    release with the expected flag and assets. A unit with
    `release_record: none` has no release record; its tag record is its full
    record.

  revalidate: >-
    At `revalidation` on, `revalidate` runs after `record` and
    `release-record` and before the deliver stage, with `contents: read` and
    `actions: read` and no environment. It trusts no output of an earlier job
    except the release commit's id and the plan's tag names. In a fresh
    checkout it fetches the remote tags and requires each released unit's
    primary tag to peel to the release commit and pass `intentional verify`,
    and the release commit's only parent to be the source commit. It builds
    the release commit again from the source commit, exactly as `resolve`
    does, and requires the same commit id. It proves the continuous
    integration evidence for the source commit again. For each release
    record it downloads the published assets and requires each asset's
    SHA-256 to equal the matching build artifact's and the published
    `SHA256SUMS` to list exactly those digests.

  deliver: >-
    Each part's `publish-` jobs check out the release commit. A part that
    declares a secret or an App runs in the environment `publish-<part>`, and
    the parent writes the credential steps of `delivery-skeleton` as the
    job's first steps. Each publish job reads the registry or target first
    and does only what is missing: a version already published with the same
    bytes succeeds, and different bytes fail before any write. A publish job
    of a unit that requires a release record runs only when that unit's
    `release-record` succeeded. The `repo-wyrd-foo` part mints its publisher
    token with the token action, for the package inbox repository, and hands
    the submit action that token rather than a key.

  verify: >-
    Each part's `verify-` jobs read back what was published. At
    `provenance` on, `verify-provenance` downloads every asset of every
    release record, other than `SHA256SUMS` and `release-evidence.json`, and
    runs `gh attestation verify <file> --repo <owner>/<repository>
    --signer-workflow <owner>/<repository>/.github/workflows/release.yml`,
    with `contents: read` and `attestations: read`. When the release model
    gives any tag `require_phase: after-publication`,
    `prepare-after-publication-tags` runs after every verify job of the run
    has succeeded, with `contents: read` and no environment: it checks out the
    source commit with full history, computes the plan there, requires its
    `digest` to be the tag records' `plan-digest`, checks out the release
    commit, runs `intentional tag --plan <plan> --phase after-publication`,
    and uploads the plan and the new tag objects as the bundle artifact
    `after-publication-tags`. `tag-after-publication` then enters
    `package-tags`, checks with Git alone that the bundled tags are exactly
    the plan's tags with `after-publication`, by name, and that each is
    annotated and points at the release commit,
    skips tags already on the remote that point at the same tag object, and
    pushes the rest atomically with a token the token action mints from the
    package tags App with `permission-contents: write`. At `evidence` on,
    `evidence` runs last with `contents: write` through `GITHUB_TOKEN`: it
    writes `release-evidence.json` and attaches it to each release record,
    and when the asset already exists it succeeds only if the bytes are
    identical. Airlock keeps GitHub's immutable releases off for the
    repository, so the evidence file can join a published record.

  evidence-file: >-
    `release-evidence.json` is canonical JSON, keys sorted by code point, two
    space indent, one final newline, with `$schema`
    `https://wyrd.foo/delivery/release-evidence/1`. It holds `repository`;
    `run` with `id`, `attempt` and `url`; `source_commit`; `release_commit`;
    `plan_digest`; `tier`; `ceremony`, the effective ceremony; `ci` with the
    push run's `id`, `head_sha` and `conclusion`; and `units`, mapping each
    released unit id to `tag`, `version`, `prerelease`, `assets` (each `name`
    with its `sha256`), `publications` and `consumers`. Each part's publish
    and verify jobs upload a fragment artifact `evidence+<job id>+<unit>`,
    a JSON object with `publications`, each a `part`, a `coordinate` such as
    `npm:@scope/name@1.2.3`, the `sha256` of the bytes read back, and, when
    the part verified provenance, `provenance` with `predicate_type` and
    `signer_workflow`; and `consumers`, each a `part`, a `phase` (`before` or
    `after`), a `runner` and a `result`. A unit without a release record has
    its evidence in the run's artifact `release-evidence` only.

  phased-tags: >-
    A run identifies a release by its primary tags, which the release commit
    carries. Tags of the plan with no `require_phase` or with
    `before-publication` are created by `resolve` and pushed by `record`
    with the release commit. Tags with `after-publication` are created by
    `prepare-after-publication-tags` once every verify job succeeded and
    pushed by `tag-after-publication` through the package tags App. A primary tag with `after-publication` is refused by
    `resolve`.

  internal-part-interfaces: >-
    The parent's internal part interfaces are `build_jobs`, `assemble_jobs`,
    `consume_jobs`, `publish_jobs`, `verify_jobs`, `credentials` and `apps`.
    The job interfaces have key patterns `^build-[a-z0-9]+(-[a-z0-9]+)*$`,
    `^assemble-...`, `^consume-...`, `^publish-...` and `^verify-...` with the
    same tail, and all use the skeleton's `schemas/part-job.schema.json`. A
    job key is its
    GitHub job id. `consume_jobs` run in the build stage after every build and
    assembly job and are rendered only at `consumer-before` on; a part's
    `verify_jobs` that install from the registry carry `consumer: true` in
    `target.yml` and are rendered only at `consumer-after` on. `credentials`
    has key pattern `^[a-z0-9]+(-[a-z0-9]+)*$` and uses
    the skeleton's `schemas/credential.schema.json`, whose members are
    exactly `name`, the
    Key Vault secret name; one of `env`, the name the reading steps receive it
    as, and `fields`, which maps each member of a JSON secret to such a name;
    `purpose`, one line; and an optional `unless` naming a boolean answer that
    removes it. `apps` has the same key pattern; each value gives `prefix`,
    the `<APP>` of its variables; `slug`, `owner` and `repositories`, each a
    literal or the id of an answer; `permissions`, a map of GitHub App
    permission to `read` or `write`; and `purpose`. A part's job keys never
    equal a parent job id. The parent mints each App's token in a step with
    id `app-<key>` and gives the part's steps `steps.app-<key>.outputs.token`
    through `env`. A part that declares a credential or an App runs its
    deliver jobs in `publish-<part>`; its other jobs, and every job of a part
    that declares neither, enter no environment. Repository tests refuse
    repeated keys within an interface.

  part-job-schema: >-
    The skeleton's `schemas/part-job.schema.json`, which both templates use,
    validates one job value of a job
    interface. Required members are `units`, Release Unit ids separated by
    one space, and `job`, a GitHub job object. The optional member `if` is an
    extra GitHub expression without `${{ }}` that cannot call `always`,
    `success`, `failure` or `cancelled`. `job` admits `name`, `runs-on`,
    `permissions` (required), `env`, `defaults`, `timeout-minutes`,
    `strategy`, `container`, `services`, `outputs` and `steps` (required). It
    refuses `needs`, `if`, `uses`, `secrets`, `environment`,
    `continue-on-error` and `concurrency`. `permissions` admits only
    `contents: read`, `actions: read`, `id-token: write`,
    `attestations: write` and `packages: read` or `write`. `env` names cannot
    start with `RELEASE_`, `DEPLOY_`, `AZURE_` or `GITHUB_`. A step has
    exactly one of `uses` and `run`; `uses` is a local `./` path or
    `owner/repo[/path]@<40-hex commit> # <version>`. `run` and step `if`
    cannot contain `${{`, and a step's `env` value can contain `${{ }}` only
    as `${{ steps.credentials.outputs.<env> }}` for a declared credential or
    `${{ steps.app-<key>.outputs.token }}` for a declared App.

  optional-parts-form: >-
    After `release_model` the parent asks `targets`, a top-level
    `multiselect` with `parts: true`, no `when`, and literal part names
    matching `^[a-z0-9][a-z0-9_-]*$`, placed before every flow node. `--with`
    and `--without` select parts on `apply` and `stage`, including
    `--update`; removing a part removes its jobs from the candidate, and the
    three-way merge reports any conflict. The applied entry records the
    settled list in `parts`. Each part is a directory `targets/<part>/` with
    `target.yml`, loaded into the parent's `data` with Toha's `!include` as
    `release_targets.<part>`, listing its job ids by stage, the answer id
    that holds its units, its `credentials`, its `apps`, and the members of
    the release model it reads. Each job body is a partial
    `targets/<part>/<job id>.yml`, or `.jinja` for product recipes, that
    writes the job's YAML below the line the parent writes for its id, with
    an optional `targets/<part>/<job id>.env.yml` whose entries follow the
    parent's `RELEASE_` values in the job's one `env` mapping. A Jinja
    include name is a string literal, so the parent writes each include inside
    `{% if '<part>' in targets %}`. A repository test renders the parent once
    per part, parses each part job with a comment-preserving parser, rejoins
    each external `uses` reference with its version comment, removes the
    parent-owned members, adds `units`, and validates the result against
    `part-job.schema.json`; it validates every credential and App against
    their schemas after removing `unless`.

  product-recipes: >-
    Selecting `product-build` asks for Release Unit ids; a document whose
    `targets` entries pair a product target identifier with a runner label or
    label array, read from `.github/release-builds.json` and validated against
    `schemas/product-build-matrix.schema.json`; a local build action path; and
    whether assembly is enabled, with `product_assembly_recipe` (default
    `./.github/actions/release-assemble`) and `product_assembly_runner`
    (default `ubuntu-latest`) when it is. Each released unit and target calls
    the build action on the release commit with `unit`, `target` and
    `output-directory`; the assembly action receives `unit`,
    `input-directory` and `output-directory`. Both inherit the parent's
    `RELEASE_` values and request only `contents: read`, and at `provenance`
    on also `id-token: write` and `attestations: write` for the parent's
    attestation step. Recipes write regular files directly in their output
    directory, with distinct names across targets and assembly; empty output
    fails. The parent provisions the official `@actions/artifact` package from
    the parent-owned `targets/product-build/artifact-client/package.json` and
    `package-lock.json`, which Toha emits under
    `.github/release-artifact-client`, with `npm ci` and lifecycle scripts
    disabled in runner temporary storage, and fails with a named diagnostic
    when the inputs are missing or the locked install fails. Each file
    becomes an artifact named `release-asset+<unit>+<file>`, and an existing
    name fails rather than overwrites. Assembly downloads only the current
    run's matching build artifacts into per-artifact subdirectories. The
    optional verification recipe, `product_verification` (default false) with
    `product_verification_recipe` (default `./.github/actions/release-verify`)
    and `product_verification_matrix` read from
    `.github/release-verification.json`, contributes `verify-product` matrix
    entries that receive `unit`, `matrix-entry`, `tag`, `version` and
    `prerelease` from the unit's resolved release, with `contents: read` only.

  rehearsal: >-
    `release-rehearsal.yml` runs `resolve` in rehearsal mode on the calling
    commit: it computes the plan, ends with success when the plan is empty,
    and otherwise builds the release commit and its tags locally exactly as
    mode `release` does, without the default branch head and continuous
    integration checks. It then runs every build, assembly and clean-consumer
    job, and every publish job with `RELEASE_REHEARSAL=true`, in which each
    part performs its dry run: it reads and computes everything it would
    publish and writes nothing outside the run. No rehearsal job enters an
    environment or reads a credential.

  authority-smoke: >-
    `release-authority-smoke.yml` runs only on `workflow_dispatch`, with
    `permissions: {}`. Its one job `smoke` enters `release-authority` with
    `contents: read` and `id-token: write`, runs the token action for the
    calling repository with `permission-contents: read`, requires
    `GET /installation/repositories` with that token to list exactly the
    calling repository, requires the repository's effective rulesets read with
    `GITHUB_TOKEN` to refuse tag updates and deletions, to restrict tag
    creation, and to require a pull request on the default branch, and writes
    the result to the job summary. It changes nothing, and its token is
    revoked when the job ends.

  intentional-check: >-
    `intentional.yml` runs on `pull_request` with one job, `intentional`,
    holding `contents: read`. It installs the pinned Intentional, runs
    `intentional check`, and fails when `intentional status --json` reports
    `release_model_stale` as true.

  resolve-outputs: >-
    Beyond the skeleton's outputs, `resolve` exposes `plan_digest`,
    `record_units` (a JSON array of released units whose policy is
    `required`) and `record` (`'true'` when `record_units` is not empty). A
    job that serves several units reads `RELEASE_UNITS` and acts only for
    units in both lists. Every job checks out the release commit except
    `resolve` and `record`, which check out the source commit; before the
    release commit is on the remote, build jobs fetch it from the
    `release-candidate` bundle.

  template-updates: >-
    An update runs `toha apply gh:wyrd-company/.github#templates/release .
    --update`. Its merge base is rendered from the applied entry's template
    commit, `answers`, `parts`, frozen `generated` instant and `context`; a
    rendered whole file is a base only when its Git object id equals its
    recorded `blob`, otherwise the recorded object is used when the
    repository holds it, and differing candidate bytes conflict when neither
    is available. An unfetchable recorded commit refuses the update and names
    explicit `--baseline` adoption.

  implementation-validation: >-
    Local render tests cover every part alone and together, each tier, each
    control set on and off, and each stage empty, and validate every rendered
    declaration against the declaration schema. A condition table checks every
    gate for success, skip, failure, cancellation and empty released units.
    Tests of `resolve` against local repositories with a local bare remote
    cover modes `release`, `recover`, `baseline` and `none`, a superseded
    source commit, a partial set of tags, a primary tag with
    `after-publication`, a missing continuous integration run and a missing
    rehearsal job; two independent constructions of one release commit and
    its tags produce equal object ids. Tests of `record` push to a local bare
    remote and cover a moved default branch, a bundle whose tag points
    elsewhere, a plan digest mismatch and a recovery that pushes nothing. The
    release record cases cover each retry state, on a unit with build assets
    and one without, and an attached evidence file. Named mutation controls
    remove each gate conjunct, each mode check, the approval check, the plan
    digest check and the commit identity, and each must fail a test. The
    suite runs as `tests/release/README.md` states, with `TOHA_BIN` naming a
    Toha 0.4.1 release build, `INTENTIONAL_DIR`, `RELEASE_ARTIFACT_NPM_CACHE`,
    `RENOVATE_PACKAGE_DIR` and `actionlint`, and `actionlint` passes on every
    rendered workflow. Live
    cases run on `wyrd-company/release-process-testbed` with the test App: a
    dispatched release creates the release commit and its tags; a second
    dispatch for the same source commit recovers and changes nothing; a
    publication failure followed by a dispatch completes only what was
    missing; an automatic start follows a successful continuous integration
    run; a baseline dispatch creates the baseline tag; and
    `release-authority-smoke.yml` passes.

  contract-versioning: >-
    `release-process` names the parent's internal interface ids, key
    patterns, both internal schemas, `resolve` outputs, `RELEASE_`
    environment names, the stages and their gates, the rendered file paths
    and the delivery declaration it renders. Each part ships with the parent
    and changes with it. Adding a part is a parent revision, and an outside
    part uses a fork of the parent. Airlock accepts parent revisions by
    organization-configured refs and reads the selected parts from the
    applied entry. A schema URI, once published, is immutable, and a change
    mints a new one.

  security-surface: >-
    The release commit and its tags are pushed only by `record`, with a token
    for the one repository, after validation in jobs that hold no credential.
    Grantable part job permissions are `contents: read`, `actions: read`,
    `id-token: write`, `attestations: write` and `packages: read` or `write`;
    `contents: write` belongs to `release-record` and `evidence` through
    `GITHUB_TOKEN`, which organization rulesets prevent from creating tags or
    updating the default branch. Credentials are Key Vault secrets and keys
    reached through environments, checked by preflight jobs that never print
    a value; no job that holds one runs Intentional or a repository recipe,
    and a secret reaches only the steps whose `env` names it. Scripts contain no `${{ }}`, part conditions cannot
    call status functions, and every external action is pinned by commit.
    Repository recipes run in jobs with read-only contents and no credential.
    Answers, the applied record and the delivery declaration contain names,
    never values.

  agreements: >-
    This design agrees with Intentional's release model design on the input
    `.intentional/release-model.json`, the schema identity
    `https://intentional.foo/schemas/release-model/1`, `release_record`
    values `required` and `none`, Intentional creating no release record and
    pushing nothing, and bare SemVer tags with `tags.primary.template` read
    verbatim; and with its tag record contract `contract-1`, whose
    `baseline` field marks a baseline. It follows Toha's `part-declaration`,
    `part-selection`, `part-removal`, `applied-record` and
    `release-model-agreement`. Airlock reads the record and the release model
    at the audited revision as plain JSON validated against vendored copies
    of their published schemas, and reads the delivery declarations as
    `delivery-controls` states. The release-process conformance rules check
    the fixed `.github/workflows/release.yml` with a `workflow_dispatch`
    trigger taking `source-sha` and a `workflow_run` trigger on the
    continuous integration workflow; release commits and tags pushed only by
    the `record` job; the `baseline` field as the baseline signal; and one
    published release record per release of a `required` unit on its primary
    tag, prereleases included.
