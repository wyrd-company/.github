$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - delivery-standard
    - delivery-skeleton
    - delivery-controls
    - release-process
  references:
    - delivery-environments
    - delivery-declaration
    - continuous-integration
  assumes:
    - wrangler-deploys-a-prebuilt-bundle
    - cloudflare-deploy-token-permissions
    - worker-version-tag-holds-the-release-tag
objective: >-
  Define contract `deploy-process`: the Toha deploy template in this
  repository that renders a repository's deploy workflow, which ships one
  release of one Release Unit to the repository's environments in order, on
  the stages it shares with the release workflow; and its first deploy part,
  `cloudflare-worker`, which deploys a Cloudflare Worker and applies its D1
  migrations.
background:
  current-design: >-
    A deploy is done by hand. `truename-idp`, the first adopter, deploys to
    one Wrangler environment, `staging`, with `scripts/deploy-staging.sh`:
    it type-checks, builds its interface into `ui/dist`, runs
    `wrangler deploy --env staging` with a token from a local `.env` file, and
    runs `wrangler d1 execute READ_MODEL --env staging --file schema.sql`
    without `--remote`. Its Worker binds Durable Objects with migrations, KV
    namespaces, a D1 database, an R2 bucket and a queue it both produces to
    and consumes, and reads its runtime secrets as Worker secrets set with
    `wrangler secret put`. It pins `wrangler` 4.81.1 in its lock file. The
    delivery standard decides that a deploy ships a release, that deploy
    targets are parts of the deploy template, that the deploy template shares
    the release template's stages, that every credential reaches a job
    through an environment and Key Vault, and that Terraform creates and
    changes every cloud resource.
  problems:
    - >-
      A deploy must ship exactly what a release recorded, through the
      environments in order, without a build running beside a credential.
    - >-
      Deploying a release that is already deployed must change nothing, and a
      deploy that stopped part way must finish by running again.
    - >-
      A Worker's schema must reach its database before the code that needs it,
      in every environment, the same way each time.
design-challenges:
  build-without-credentials: >-
    The part builds the Worker's bundle for each environment in a job that
    holds no credential and deploys that bundle unchanged with
    `wrangler deploy --no-bundle`. The decision record
    `build-the-worker-once-and-deploy-the-bundle` holds the trade-off.
  already-deployed-changes-nothing: >-
    Wrangler creates a new version on every deploy, so the part reads the
    environment's deployment first and deploys only when the version serving
    all traffic does not carry the release's tag or a migration is pending.
  schema-before-code: >-
    Each deploy applies pending D1 migrations before it uploads the Worker,
    so the new code always meets its schema. Migrations are additive while
    the code before them still runs, which the adopting repository keeps
    true.
  cloud-resources-belong-to-terraform: >-
    Terraform declares the account's databases, namespaces, buckets, queues,
    routes and custom domains. The deploy uploads the Worker script with what
    its Wrangler environment binds and declares, and a Wrangler environment
    that declares a route or a custom domain fails the build.
proposed-design:
  high-level-overview: >-
    The parent template `deploy` accepts the release model through a
    document question and renders `.github/workflows/deploy.yml`,
    `.github/workflows/deploy-rehearsal.yml` and
    `.github/delivery/deploy.json`. The deploy workflow runs the six skeleton
    stages for one release of the Release Unit `deploy_unit`. `resolve`
    decides which release and which environments, from a dispatch or from a
    completed release run, and revalidates the release. Build produces each
    environment's bundle without credentials. Record is the GitHub deployment
    that each deploy job creates when it enters its environment, and the
    Worker version annotations that name the release. Deliver and verify run
    once per environment in chain order: `deploy-<environment>` checks its
    credential, reads back what is deployed, applies pending migrations and
    deploys the bundle; `verify-<environment>` runs the repository's
    verification recipe against it. Deploy targets are parts inside this
    parent; `cloudflare-worker` is the first.

  repository-layout: >-
    `templates/deploy/` holds `template.yml`, `schemas/` with the vendored
    release model schema, `skeleton/` (the copy of `templates/skeleton/`),
    `partials/`, `targets/cloudflare-worker/` with its `target.yml` and job
    partials, and `template/`, whose rendered files are
    `.github/workflows/deploy.yml`, `.github/workflows/deploy-rehearsal.yml`
    and `.github/delivery/deploy.json`. The template is addressed as
    `gh:wyrd-company/.github#templates/deploy` and applied beside the release
    template, which every repository on the standard applies.

  interview: >-
    `release_model` is the same document question as the release
    template's. `targets` is the part question, a top-level `multiselect` with
    `parts: true` and the option `cloudflare-worker`. `deploy_unit` is a
    `select` of the release model's units that have a primary tag.
    `environments` is a looped `text` question, at least one entry, each
    validated by `^[a-z][a-z0-9]*(-[a-z0-9]+)*$`, in the order an automatic
    deploy enters them; the release template's environment names are
    refused. Each part's questions carry `when` conditions on `targets`.

  triggers-and-resolve: >-
    `deploy.yml` has `workflow_dispatch` with the required input
    `release-tag` and the `choice` input `environment`, whose options are the
    answered environments and `all` (the default), and a `workflow_run`
    trigger on `Release` with `types: [completed]`. For a `workflow_run`
    event, `resolve` ends with mode `none` unless the release run concluded
    `success`; it downloads that run's `release-outcome` artifact and ends with
    mode `none` unless `deploy_unit` is among its released units, whose tag is
    then the release tag, and the environments are the whole chain. For a
    dispatch, the tag and the environments come from the inputs. `resolve`
    then requires the tag to be annotated, to pass
    `intentional verify <tag> --json`, and to carry the record `tag-id`
    `release-unit/<deploy_unit>/<primary tag key>` with `baseline: false`; the
    commit it points at to be contained in the default branch head and to have
    one parent; and, when the unit's `release_record` is `required`, a
    published GitHub Release on the tag. It reads the release declaration,
    observes the rung, and computes the effective ceremony at that rung; a
    `workflow_run` start with effective `deploy-start` `person` ends with mode
    `none`. Otherwise the mode is `deploy`. Beyond the skeleton's outputs it
    exposes `tag`, `version` and `environments`, a JSON array in chain order.

  stages: >-
    The deploy workflow's check of credentials happens inside each
    `deploy-<environment>` job, because every deploy environment carries the
    `deploy-approval` control. Build holds `build-<part>`. Record holds no
    parent job: entering an environment creates its GitHub deployment, and
    the part writes the release tag and a message on the Worker version it
    creates. Deliver and verify repeat per environment: the jobs for an
    environment run only when it is in `environments`, and each
    `deploy-<environment>` needs `verify-<previous environment>` in chain
    order. Every job between them follows the skeleton's stage gate, so a
    failure in one environment stops every later one.

  cloudflare-worker-build: >-
    `build-cloudflare-worker` runs with `contents: read` and no environment.
    It checks out the release commit with `persist-credentials: false`, sets
    up Node from the file `cloudflare_worker_node_version_file` names
    (default `package.json`), and in `cloudflare_worker_directory` (default
    `.`) runs `npm ci`, then the local action `cloudflare_worker_build_recipe`
    when one is answered. For each environment of the chain it reads the
    Wrangler configuration, `wrangler.toml`, `wrangler.json` or
    `wrangler.jsonc`, and fails when the environment is not declared or when
    the configuration declares `route`, `routes` or a custom domain at the top
    level or in that environment. It runs `npx wrangler deploy --dry-run
    --outdir .deploy/<environment> --env <environment>`, records the entry
    module's file name and the SHA-256 of every file the dry run wrote, and
    uploads the working directory without `.git` and `node_modules` as the
    artifact `deploy-tree+<environment>`, which carries the bundle, the
    configuration, every D1 migrations directory and the static assets
    directory the configuration names.

  cloudflare-worker-deploy: >-
    `deploy-<environment>` enters the environment with `contents: read`,
    `actions: read` and `id-token: write`. When the effective
    `deploy-approval` is `person` it runs the approval check first. It reads
    `cloudflare-api-token` through the credential route, which is its check
    of credentials. It downloads `deploy-tree+<environment>`, requires every
    bundle file's SHA-256 to equal the build's, and runs
    `npm ci --ignore-scripts` so that Wrangler comes from the repository's
    lock file and no dependency script runs. The Wrangler steps receive
    `CLOUDFLARE_API_TOKEN` from the credential step and
    `CLOUDFLARE_ACCOUNT_ID` from the environment's variable. It reads the
    deployed state with `npx wrangler deployments status --env <environment>
    --json` and, for the version at 100 percent, `npx wrangler versions view
    <version id> --env <environment> --json`, whose
    `annotations["workers/tag"]` is the deployed release tag; and, for each
    binding in `cloudflare_worker_d1_databases`, the migrations that
    `npx wrangler d1 migrations list <binding> --remote --env <environment>`
    reports as unapplied. When the deployed tag is the release tag and no
    migration is pending, it writes a summary that the release is already
    deployed and changes nothing. Otherwise it runs `npx wrangler d1
    migrations apply <binding> --remote --env <environment>` for each binding
    in the answered order, then `npx wrangler deploy
    .deploy/<environment>/<entry> --no-bundle --env <environment> --tag
    <release tag> --message "<release tag> <release commit> <run url>"`, and
    reads the deployment again, requiring the version at 100 percent to carry
    the release tag. It never sets, replaces or deletes a Worker secret.

  cloudflare-worker-verify: >-
    `verify-<environment>` runs with `contents: read` and no environment. It
    checks out the release commit and runs the local action
    `cloudflare_worker_verify_recipe` (default
    `./.github/actions/deploy-verify`) with the inputs `environment`, `tag`
    and `version`; the action checks the deployed Worker as its consumers use
    it, holds no credential, and fails the job when the check fails.

  cloudflare-worker-configuration: >-
    The part asks `cloudflare_worker_directory`,
    `cloudflare_worker_node_version_file`, `cloudflare_worker_build_recipe`
    (a local action path or empty), `cloudflare_worker_d1_databases` (D1
    binding names separated by one space, or empty) and
    `cloudflare_worker_verify_recipe`. Each deploy environment is a Wrangler
    environment of the same name, so `--env <environment>` selects it. The
    Wrangler configuration binds the resources Terraform declares by their
    ids, declares no route and no custom domain, and keeps each D1 database's
    schema as numbered migrations in that binding's migrations directory. The
    upload writes the Worker's code, static assets, bindings, compatibility
    settings, variables, Durable Object migrations, queue consumers and cron
    triggers as the environment declares them; Terraform declares none of
    these. The Worker's runtime secrets are placed by Elegua and are absent
    from the repository, the configuration and the workflow. The environment's
    `cloudflare-api-token` can edit the account's Workers scripts and D1
    databases and the queues the Worker consumes, and nothing else.

  rehearsal: >-
    `deploy-rehearsal.yml` runs on the calling commit with no environment and
    no credential. It ends with success when Intentional reports no pending
    intent; otherwise it runs `build-<part>` for every environment of the
    chain, including the configuration checks and the dry-run bundles.

  recovery: >-
    A deploy dispatched again for the same release and environment reads the
    deployed state, applies any migration still pending and deploys only when
    the release is not already serving all traffic. A failure in one
    environment leaves the earlier environments deployed and verified, and a
    dispatch naming the failed environment finishes the chain.

  deploy-environment: >-
    Every deploy job receives the skeleton's `RELEASE_` values for the
    deployed release, `DEPLOY_ENVIRONMENT` and `DEPLOY_TAG`, set by the parent
    and not overridable.

  implementation-validation: >-
    Local render tests cover the part with one environment and with a chain
    of two, an empty migration list, and a build recipe, and validate the
    rendered declaration against the declaration schema. A condition table
    checks the per-environment gates for success, failure, skip and
    cancellation. Tests of `resolve` cover a dispatch, a completed release
    run that released the unit, one that released another unit, one that
    failed, a baseline tag, a tag outside the default branch and a missing
    release record. Tests of the configuration check refuse a top-level route,
    an environment route and a custom domain. Tests of the deploy job run
    against a fake Wrangler on `PATH` and cover a first deploy, a pending
    migration with the release already deployed, an already deployed release
    with nothing pending, a bundle digest mismatch, and a read-back that does
    not show the release tag. Named mutation controls remove the read-back,
    the digest check, the migration order and the approval check, and each
    fails a test. Live cases deploy a release of a test Worker with a D1
    database to two environments in order, deploy the same release again
    with no change, and deploy after a new migration.

  security-surface: >-
    The only job that holds the Cloudflare token is `deploy-<environment>`,
    inside its environment, after the bundle was built without credentials;
    it runs no repository code and no dependency script. Its token reaches
    only the Wrangler steps through their `env`. The deploy grants itself no
    access, changes no trust, writes no secret, and creates no cloud resource
    that Terraform declares.
