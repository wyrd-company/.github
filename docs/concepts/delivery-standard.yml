$schema: https://refinery.systems/ontology/concept
relationships:
  related-to:
    - release-process
description: >-
  The delivery standard is the one way a Wyrd repository versions, releases,
  deploys, and obtains credentials. A repository adopts it by answering a Toha
  interview, and receives each change to it as a pull request. Each part of
  the standard has one owner and one thing it writes, so that a reader can say
  for any setting, secret, resource, or workflow which tool put it there and
  which tool checks it.
properties:
  release-model: >-
    The committed description of what a repository releases: its release
    units, their versions, and their tags. Intentional computes versions from
    intents and writes the model, the changelogs, and the annotated tag
    records. Intentional holds no workflow and publishes nothing.
  template: >-
    A Toha template in the organization's `.github` repository that renders a
    workflow from the release model and the interview answers. The release
    template and the deploy template share one skeleton of stages: resolve the
    source, check credentials, build, record, deliver, verify. Publication
    targets and deploy targets are parts a repository selects.
  applied-record: >-
    The committed `.toha.json` that names the template revision, the selected
    parts, and the answers a repository rendered from. Toha renders the files
    and merges each template update into them. Toha pushes nothing and holds
    no secret.
  tier: >-
    The sensitivity of a repository, declared once as an organization-owned
    property of the repository. The test is what a bad release can reach. A
    Custodial repository holds other people's secrets or data, or can change
    other repositories. A Trusted repository runs inside other people's builds
    and releases with their credentials. A Standard repository affects only
    whoever runs it. The tier selects which controls its workflows carry,
    which protection rules its environments have, and whether its secrets
    rotate unattended. A repository cannot lower its own tier.
  control: >-
    One safeguard a workflow or the organization applies to a release or a
    deploy. The controls are: creation of the release commit and tag by the
    workflow; separate GitHub Apps for separate write operations; a key that
    exists only in one protected environment; organization rulesets that make
    tags immutable and refuse unclassified tags; a smoke workflow that proves
    an authority without changing anything; a release rehearsal in continuous
    integration for every commit with unreleased intents; a digest-sealed
    release plan committed with the release; independent revalidation before
    publication; provenance verified on read-back; clean-consumer installs
    before and after publication; a durable evidence file on the release
    record; recovery from the immutable tag that performs only missing work;
    and a separate first-publication path for registries that need the
    package to exist before federation.
  release-authority: >-
    A GitHub App that is the only actor allowed to create a release commit on
    the default branch and its tag. The release workflow uses it inside a
    protected environment after validation finishes in a job that holds no
    key. Every tier releases this way; no person's workstation writes a
    release commit or a release tag.
  environment: >-
    A GitHub environment of a repository. It is the only route from a workflow
    job to a credential, and it carries the protection rules the tier
    requires. It holds the identifiers for federated sign-in to Azure and no
    secret value.
  key-vault: >-
    The Azure Key Vault a workflow reads from after federated sign-in through
    its environment. Every credential a workflow needs that a service cannot
    federate is a Key Vault secret. A publication credential and a deploy
    credential have the same shape.
  secret-manifest: >-
    Elegua's declaration of every long-lived credential: its issuer, the
    stores that carry it, and its rotation policy. Elegua mints, places,
    verifies, rotates, and revokes each credential. No other part creates or
    replaces a secret.
  cloud-resource: >-
    A resource in Cloudflare, AWS, or Azure, including each Key Vault, the
    Terraform state storage, and the trust between GitHub and Azure. Terraform
    creates and changes cloud resources and holds no secret value.
  repository-settings: >-
    The GitHub configuration of a repository and the organization: rulesets,
    environments and their protection rules, and the federated sign-in
    identifiers. Airlock applies them from the declared configuration, and
    its audit reports any difference between the declaration and what GitHub
    and the registries hold.
features:
  adopt-by-interview: >-
    A repository answers the template's questions, including its targets, and
    commits the rendered workflows and the applied record.
  update-by-pull-request: >-
    A change to a template reaches each adopting repository as a pull request
    that merges the new revision into the rendered files.
  release-from-a-source-commit: >-
    A release starts from one commit of the default branch that has passed
    continuous integration. The workflow creates the release commit and tag
    through the release authority, then delivers through the selected parts.
  read-credentials-through-an-environment: >-
    A job enters its environment, signs in to Azure by federation, and reads
    only the Key Vault secrets its part declares.
  audit-conformance: >-
    Airlock reads the applied record, the release model, the repository
    settings, and the tier, and reports whether the repository runs the
    standard its tier requires.
open-questions:
  Q01: >-
    Which controls does each tier carry?
  Q02: >-
    Does a deployed product carry an Intentional version and a release record,
    or does a deploy identify itself by an accepted commit? Proposed: a deploy
    ships an Intentional release at the upper two tiers.
  Q03: >-
    Which part opens the template update pull request in each adopting
    repository?
  Q04: >-
    How are products and environments separated across cloud accounts?
    Proposed: one cloud account per product, with a separate account per
    environment available at the highest tier.
  Q05: >-
    How does a deploy sign in to an AWS account type that refuses federation?
    Proposed: one limited access key held in Key Vault.
  Q06: >-
    Can a workflow have Key Vault sign for a GitHub App so that the App's
    private key never reaches a runner?
  Q07: >-
    Where does an operator see every domain and its state?
  Q08: >-
    Which workflows other than release and deploy does the standard render:
    continuous integration, documentation publishing, audit?
exclusions:
  - Intentional generating or running workflows.
  - Terraform changing GitHub settings.
  - A workflow creating, replacing, or revoking a secret.
  - A workflow or a deploy granting itself access or changing its own trust.
  - Portunus as a part of the standard.
