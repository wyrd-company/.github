{# relationships: implements: release-process #}
name: Verify npm clients
runs-on: {% raw %}${{ matrix.os }}{% endraw %}
permissions:
  contents: read
strategy:
  fail-fast: false
  matrix:
    os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
steps:
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
    with:
      node-version: '24'
      registry-url: https://registry.npmjs.org
  - name: Install the exact released packages in a clean client
    uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
    with:
      script: |
{% set script %}{% include 'targets/npm/npm.js' %}{% endset %}{{ script | indent(8, true) }}
        await npmRelease({env: process.env, verify: true});
