{# relationships: implements: delivery-controls -#}
# Generated by the airlock-config template. Update with Toha; the template owns the action pin.
# The run's own token audits this one repository, and Airlock accepts it only
# because every permission the job declares is read.
name: Airlock audit
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [{{ default_branch | tojson }}]
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Audit this repository
        uses: wyrd-company/airlock@aa31121c5ead759d07c21915004de8c52b7597a7 # epic/standards-realignment, unreleased
        with:
          mode: repository
          token: {% raw %}${{ github.token }}{% endraw %}
          policy: {% raw %}${{ github.repository_owner }}{% endraw %}/.github:airlock/policy.yml
